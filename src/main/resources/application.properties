spring.application.name=rack-tracker

# --- Banco de dados MySQL ---
# O banco "rack_tracker" e criado sozinho na primeira vez (createDatabaseIfNotExist=true).
# Troque usuario e senha pelos do MySQL da sua maquina.
spring.datasource.url=jdbc:mysql://localhost:3306/rack_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root

# --- JPA / Hibernate ---
# "update" cria e atualiza as tabelas a partir das classes do pacote model.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Porta do servidor (frontend em http://localhost:8080)
server.port=8080
